name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag override. Defaults to the current commit SHA.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/futboligy' }}
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/api/GlobalScout.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/futboligy/api:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/futboligy/api:latest

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/api/GlobalScout.Migrator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/futboligy/migrator:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/futboligy/migrator:latest

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/ui/apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.futboligy.com/api
            NEXT_PUBLIC_API_ORIGIN=https://api.futboligy.com
          tags: |
            ${{ env.ECR_REGISTRY }}/futboligy/ui:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/futboligy/ui:latest

      - name: Deploy on EC2 via SSM
        run: |
          set -euo pipefail
          COMPOSE_B64=$(base64 -w0 deploy/docker-compose.ec2.yml)
          NGINX_B64=$(base64 -w0 deploy/nginx.ec2.conf)

          # AWS-RunShellScript runs as root under sh; the inner bash heredoc gives us pipefail.
          cat > deploy.sh <<EOF
          bash <<'DEPLOY_EOF'
          set -euo pipefail
          export HOME=/root
          mkdir -p '${DEPLOY_PATH}'
          cd '${DEPLOY_PATH}'
          test -f .env || { echo "Missing ${DEPLOY_PATH}/.env"; exit 1; }
          echo '${COMPOSE_B64}' | base64 -d > docker-compose.yml
          echo '${NGINX_B64}' | base64 -d > nginx.ec2.conf
          aws ecr get-login-password --region '${AWS_REGION}' | docker login --username AWS --password-stdin '${ECR_REGISTRY}'
          ECR_REGISTRY='${ECR_REGISTRY}' IMAGE_TAG='${IMAGE_TAG}' docker compose --env-file .env pull
          ECR_REGISTRY='${ECR_REGISTRY}' IMAGE_TAG='${IMAGE_TAG}' docker compose --env-file .env up -d --remove-orphans
          docker image prune -f
          DEPLOY_EOF
          EOF
          jq -n --rawfile script deploy.sh '{commands: [$script]}' > ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${IMAGE_TAG}" \
            --timeout-seconds 1800 \
            --parameters file://ssm-params.json \
            --query Command.CommandId --output text)
          echo "SSM command: ${CMD_ID}"

          STATUS=Pending
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "${CMD_ID}" --instance-id "${EC2_INSTANCE_ID}" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "${STATUS}" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "${CMD_ID}" --instance-id "${EC2_INSTANCE_ID}" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true

          if [ "${STATUS}" != "Success" ]; then
            echo "::error::Deploy command finished with status ${STATUS}"
            exit 1
          fi
